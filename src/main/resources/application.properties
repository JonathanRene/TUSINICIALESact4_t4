spring.application.name=act4_t4
# Configuración del servidor (Puerto nuevo)
server.port=8086

# Configuración de base de datos MySQL (Local XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_act4_t4?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (Crea/actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true